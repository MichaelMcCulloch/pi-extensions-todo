\* TLC configuration: three items, two priority values, four sequence numbers.
\* Small enough for an exhaustive check, large enough for a chain, an
\* independent heap, heap merge, rewire, reopen, and removal with dependents.
CONSTANTS
    Items = {"i1", "i2", "i3"}
    MaxPriority = 2
    MaxSeq = 4

SPECIFICATION Spec

INVARIANT ViewInv

\* The fixture saturates its Add budget (next > MaxSeq) in some reachable
